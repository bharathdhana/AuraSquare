<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-indigo-50 to-slate-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-3xl shadow-xl p-6 sm:p-8 border border-gray-100">
            <div class="text-center">
                <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-9 h-9">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                    </svg>
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">Welcome Back</h2>
                <p class="text-xs sm:text-sm mt-1.5 font-medium text-gray-500">Sign in to your <span class="text-blue-600 font-bold">AuraSquare</span> account</p>

                <form class="space-y-4 sm:space-y-5 mt-6" (ngSubmit)="onSubmit()">
                    @if (errorMessage()) {
                        <div class="text-red-700 px-3.5 py-2.5 border border-red-200 bg-red-50 rounded-xl text-xs sm:text-sm font-medium">{{ errorMessage() }}</div>
                    }

                    <div>
                        <label for="email" class="block text-xs sm:text-sm font-semibold text-gray-700 mb-1.5 text-left">Email Address</label>
                        <input type="email" name="email" id="email" class="input-field" placeholder="Enter your email address" required [(ngModel)]="credentials.email">
                    </div>
                    <div>
                        <label for="password" class="block text-xs sm:text-sm font-semibold text-gray-700 mb-1.5 text-left">Password</label>
                        <input type="password" name="password" id="password" class="input-field" placeholder="Enter your password" required [(ngModel)]="credentials.password">
                    </div>

                    <button [disabled]="loading()" type="submit" class="flex items-center w-full px-4 py-3.5 justify-center font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md hover:shadow-lg transition-all cursor-pointer active:scale-[0.98] text-sm sm:text-base">
                        @if(!loading()) {
                            Sign In
                        } @else {
                            <div class="spinner border-white"></div>
                        }
                    </button>

                    <div class="text-center pt-2">
                        <span class="text-xs sm:text-sm text-gray-500 mr-1.5 font-medium">Don't have an account?</span>
                        <a routerLink="/auth/register" class="text-xs sm:text-sm text-blue-600 hover:text-blue-800 font-bold">Register here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
