<div class="min-h-screen flex items-center justify-center bg-linear-to-br from-blue-50 to-blue-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-tl-3xl rounded-br-3xl shadow-xl p-8">
            <div class="text-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 mx-auto text-blue-500">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                </svg>
                <h2 class="mt-4 text-3xl font-bold text-gray-900">Welcome Back to <span class="bg-linear-to-bl from-amber-200 via-rose-300 to-indigo-300 bg-clip-text text-transparent">AuraSquare</span></h2>
                <p class="text-sm mt-2 font-medium text-gray-800">Sign in to your account</p>

                <form class="space-y-5 mt-6" (ngSubmit)="onSubmit()">
                    @if (errorMessage()) {
                        <div class="text-red-700 px-3 py-2 border border-red-200 bg-red-100 rounded-xl text-sm">{{ errorMessage() }}</div>
                    }

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2 text-left">Email Address</label>
                        <input type="email" name="email" id="email" class="input-field" placeholder="Enter your email" required [(ngModel)]="credentials.email">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2 text-left">Password</label>
                        <input type="password" name="password" id="password" class="input-field" placeholder="Enter your password" required [(ngModel)]="credentials.password">
                    </div>

                    <button [disabled]="loading()" type="submit" class="flex items-center w-full px-4 py-3 justify-center font-bold bg-blue-500 hover:bg-blue-600 text-white rounded-full transition-all cursor-pointer">
                        @if(!loading()) {
                            Sign In
                        } @else {
                            <div class="spinner border-white"></div>
                        }
                    </button>

                    <div class="text-center pt-2">
                        <span class="text-sm text-gray-600 mr-2 font-medium">Don't have an account?</span>
                        <a routerLink="/auth/register" class="text-blue-500 hover:text-blue-700 font-semibold">Register here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
