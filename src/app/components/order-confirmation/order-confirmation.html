<div class="min-h-screen bg-linear-to-br from-gray-50 to-gray-200 pb-12 flex flex-col">
	<app-navbar></app-navbar>
	<div class="grow flex items-center justify-center px-4 sm:px-6 lg:px-8 mt-10">
		<div class="bg-white shadow-2xl rounded-3xl py-10 px-8 w-full max-w-lg relative overflow-hidden">
            
            <div class="absolute -top-16 -right-16 w-32 h-32 bg-green-100 rounded-full opacity-50 blur-2xl"></div>
            <div class="absolute -bottom-16 -left-16 w-32 h-32 bg-blue-100 rounded-full opacity-50 blur-2xl"></div>

            <div class="text-center relative z-10">
                <div class="w-24 h-24 bg-green-50 rounded-full flex items-center justify-center mx-auto shadow-inner mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-12 h-12 text-green-500">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                </div>
                <h1 class="text-4xl font-extrabold text-gray-800 mb-2 tracking-tight">Order Confirmed!</h1>
                <p class="text-base font-medium text-gray-500 mb-6">
                    Confirmation mail is sent to <br>
                    <span class="text-green-600 font-semibold">{{ email() || 'your registered email ID' }}</span>
                </p>
            </div>

            <div class="mb-8 bg-gray-50 rounded-2xl p-5 border border-gray-100 relative z-10 shadow-sm">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Shipping Address</h2>
                <p class="text-gray-700 font-medium leading-relaxed">
                    {{ order()?.shippingAddress || 'No shipping address provided.' }}
                </p>
            </div>

            <div class="relative z-10">
                <button
                    (click)="continueShopping()"
                    type="button"
                    class="w-full inline-flex items-center justify-center bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200 text-white font-bold py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 cursor-pointer"
                >
                    Continue Shopping
                </button>
            </div>
        </div>
    </div>
</div>
