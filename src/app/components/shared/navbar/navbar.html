<nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="m-auto px-4 sm:px-6 lg:px-8 max-w-7xl">
        <div class="flex justify-between h-16">
            <div class="flex items-center cursor-pointer" (click)="navigateTo(userRole() === 'SELLER' ? '/seller/products' : userRole() === 'ADMIN' ? '/admin' : '/products')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-9 h-8 mx-auto text-blue-500 mr-2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                </svg>
                <span class="text-2xl font-bold bg-linear-to-bl from-amber-200 via-rose-300 to-indigo-300 bg-clip-text text-transparent">
                    AuraSquare
                </span>
            </div>

            <div class="hidden md:flex items-center space-x-4">

                @if(userRole() === 'USER') {
                    <button class="btn" (click)="navigateTo('/products')">Products</button>
                    <button class="btn flex" (click)="navigateTo('/wishlist')">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-5 mx-auto text-red-500 mr-1">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                        </svg>
                        Wishlist ({{ wishlistCount() }})
                    </button>
                    <button class="btn flex" (click)="navigateTo('/cart')">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-5 mx-auto text-blue-500 mr-1">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                        </svg>
                        Cart ({{ cartCount() }})
                    </button>
                    <button class="btn flex" (click)="navigateTo('/order')">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-5 mx-auto text-blue-500 mr-1">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
                        </svg>
                        Orders
                    </button>
                }

        
                @if(userRole() === 'SELLER') {
                    <button class="btn" (click)="navigateTo('/seller/products')">My Products</button>
                }


                @if(userRole() === 'ADMIN') {
                    <button class="btn" (click)="navigateTo('/admin')">Admin Dashboard</button>
                }

                @if(authService.getToken()) {
                    <button class="btn flex" (click)="logout()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-5 mx-auto text-gray-900 mr-1">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" />
                        </svg>
                        Logout
                    </button>
                } @else {
                    <button class="btn" (click)="navigateTo('/auth/login')">Login</button>
                    <button class="btn" (click)="navigateTo('/auth/register')">Register</button>
                }
            </div>
        </div>
    </div>
</nav>
